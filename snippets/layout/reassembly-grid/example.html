<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>60 — Reassembly grid</title><style>
:root{--bg:#f2ede3;--ink:#111;--hot:#ff4a17}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,monospace;overflow:hidden}.stage{height:100svh;display:grid;place-items:center}.grid{width:min(72vw,650px);aspect-ratio:1;display:grid;grid-template-columns:repeat(8,1fr);gap:3px}.piece{aspect-ratio:1;background:#111;will-change:transform}.piece:nth-child(5n){background:var(--hot)}.meta{position:fixed;inset:1.5rem;display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.14em}.meta b{font-weight:400;color:var(--hot)}.status{position:fixed;bottom:1.5rem;left:1.5rem;font-size:.68rem}
</style></head><body><div class="meta"><span>08 / REASSEMBLY GRID</span><b>MOVE · DISPERSE · RETURN</b></div><main class="stage"><div class="grid" id="grid"></div></main><div class="status">STATE / <span id="state">ASSEMBLED</span></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
const grid=document.querySelector('#grid'),pieces=[];for(let i=0;i<64;i++){const p=document.createElement('div');p.className='piece';grid.appendChild(p);pieces.push(p)}let dispersed=false;function toggle(){dispersed=!dispersed;document.querySelector('#state').textContent=dispersed?'DISPERSED':'ASSEMBLED';if(dispersed){gsap.to(pieces,{x:()=>gsap.utils.random(-240,240),y:()=>gsap.utils.random(-190,190),rotation:()=>gsap.utils.random(-160,160),scale:()=>gsap.utils.random(.35,1.5),duration:1.25,ease:'power3.out',stagger:{each:.012,from:'center'}})}else{gsap.to(pieces,{x:0,y:0,rotation:0,scale:1,duration:1.5,ease:'elastic.out(1,.55)',stagger:{each:.014,from:'random'}})}}grid.addEventListener('click',toggle);addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();toggle()}});setTimeout(toggle,800);
</script></body></html>
