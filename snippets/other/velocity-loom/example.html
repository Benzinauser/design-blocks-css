<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>54 — Velocity loom</title><style>
:root{--bg:#f0eadf;--ink:#111;--hot:#ff4a17}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,monospace}.stage{height:100svh;display:grid;place-items:center;overflow:hidden;position:relative}.loom{width:min(90vw,1000px);height:70svh;position:relative}.thread{position:absolute;top:50%;left:50%;width:1px;height:130%;background:#111;transform-origin:center;opacity:.65;will-change:transform}.label{position:absolute;top:1.5rem;left:1.5rem;font-size:.68rem;letter-spacing:.14em}.readout{position:absolute;right:1.5rem;bottom:1.5rem;font-size:.7rem}.core{position:absolute;left:50%;top:50%;width:10px;height:10px;background:var(--hot);border-radius:50%;transform:translate(-50%,-50%)}
</style></head><body><main class="stage"><div class="label">02 / VELOCITY LOOM · MOVE FAST</div><div class="loom" id="loom"><div class="core"></div><div class="readout">VELOCITY <b id="v">000</b></div></div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
const loom=document.querySelector('#loom'),out=document.querySelector('#v');const threads=[];for(let i=0;i<34;i++){const t=document.createElement('div');t.className='thread';loom.appendChild(t);threads.push(t);gsap.set(t,{rotation:i*180/34-90,scaleY:gsap.utils.random(.45,1.05)})}let last={x:0,y:0,time:performance.now()},speed=0;loom.addEventListener('pointermove',e=>{const now=performance.now(),dx=e.clientX-last.x,dy=e.clientY-last.y,dt=Math.max(8,now-last.time);speed=Math.min(1,Math.hypot(dx,dy)/dt*1.8);last={x:e.clientX,y:e.clientY,time:now}});gsap.ticker.add(()=>{speed*=.91;out.textContent=String(Math.round(speed*999)).padStart(3,'0');threads.forEach((t,i)=>{const phase=i/threads.length*Math.PI*2;gsap.set(t,{rotation:i*180/threads.length-90+Math.sin(performance.now()/900+phase)*speed*24,scaleY:.45+speed*(.5+.5*Math.sin(phase+performance.now()/500))})})});
</script></body></html>
