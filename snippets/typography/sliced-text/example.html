<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>40 — Sliced text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .slices { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .glass {
    position:relative; height:clamp(9rem,24vw,20rem); overflow:hidden;
    font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase;
  }
  .slice {
    position:absolute; left:0; top:0; width:100%; height:100%;
    display:grid; place-items:center; will-change:transform;
    font-size:clamp(3rem,11vw,10rem); line-height:1;
  }
  .slice:nth-child(1) { color:var(--vermillion); clip-path:inset(0 0 80% 0); }
  .slice:nth-child(2) { color:var(--amber);  clip-path:inset(20% 0 60% 0); }
  .slice:nth-child(3) { color:var(--bone);   clip-path:inset(40% 0 40% 0); }
  .slice:nth-child(4) { color:var(--teal);   clip-path:inset(60% 0 20% 0); }
  .slice:nth-child(5) { color:var(--vermillion); clip-path:inset(80% 0 0 0); }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="slices">
  <p class="kicker"><b>40</b>Sliced text — the word separates into blades as it passes</p>
  <div class="glass" data-slice="glass">
    <div class="slice" data-slice="blade">Motion</div>
    <div class="slice" data-slice="blade">Motion</div>
    <div class="slice" data-slice="blade">Motion</div>
    <div class="slice" data-slice="blade">Motion</div>
    <div class="slice" data-slice="blade">Motion</div>
  </div>
  <p class="hint">— each blade drifts at its own speed, a slow glass shear</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: five blades of one word, each clipped to its band of the
  // headline; scrolling drives each blade horizontally at a different speed,
  // shearing the word apart like glass. Reduced motion: the word stands whole.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const glass = document.querySelector('[data-slice="glass"]');
    gsap.utils.toArray('[data-slice="blade"]').forEach((blade, i) => {
      const dir = i % 2 === 0 ? 1 : -1;
      const amp = 30 + i * 26;
      gsap.fromTo(blade, { xPercent: 0 }, {
        xPercent: dir * (amp / glass.clientWidth) * 100,
        ease: "none",
        scrollTrigger: { trigger: glass, start: "top bottom", end: "bottom top", scrub: 1 }
      });
    });
  }
</script>
</body>
</html>
