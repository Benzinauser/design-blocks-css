<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>51 — Circular text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .badge { position:relative; width:min(62vw,330px); aspect-ratio:1; }
  .badge svg { width:100%; height:100%; overflow:visible; }
  .badge .orbit { fill:none; stroke:rgba(242,237,227,.2); stroke-width:1; }
  .badge .spintype { fill:var(--bone); font-family:"IBM Plex Mono",monospace; font-size:15px; letter-spacing:.34em; }
  .badge .core {
    position:absolute; inset:0; display:grid; place-items:center;
    font-family:"Anton",sans-serif; font-weight:400; font-size:clamp(3.4rem,10vw,6.5rem); text-transform:uppercase;
    color:var(--vermillion);
  }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>51</b>Circular text — one orbit, counter-rotating core</p>

  <div class="badge">
    <svg viewBox="0 0 300 300" aria-hidden="true">
      <circle class="orbit" cx="150" cy="150" r="142"></circle>
      <path id="orbit-path" d="M150,150 m-118,0 a118,118 0 1,1 236,0 a118,118 0 1,1 -236,0" fill="none"></path>
      <text class="spintype" data-ring="text">
        <textPath href="#orbit-path" startOffset="0">MOTION ATLAS · FRAMES &amp; RHYTHM · MOTION ATLAS · FRAMES &amp; RHYTHM ·</textPath>
      </text>
    </svg>
    <div class="core" data-ring="core">M/A</div>
  </div>

  <p class="hint">— the caption turns slowly; the mark turns against it</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: a slow seal — the ring of type rotates continuously while
  // the core mark counters it, keeping the whole reading still. Reduced
  // motion: the badge stands.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    gsap.to('[data-ring="text"]', { rotation: 360, transformOrigin: "50% 50%", ease: "none", duration: 30, repeat: -1 });
    gsap.to('[data-ring="core"]', { rotation: -360, transformOrigin: "50% 50%", ease: "none", duration: 30, repeat: -1 });
  }
</script>
</body>
</html>
