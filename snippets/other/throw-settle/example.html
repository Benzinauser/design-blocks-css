<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>27 — Throw & settle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .tray {
    position:relative; width:min(88vw,860px); height:clamp(200px,34vh,300px);
    border:1px solid rgba(242,237,227,.2); border-radius:3px; overflow:hidden; cursor:grab; touch-action:none;
  }
  .card {
    position:absolute; top:50%; left:50%; width:clamp(140px,20vw,220px); aspect-ratio:16/10;
    transform:translate(-50%,-50%);
    background:linear-gradient(135deg,var(--vermillion),#ff8a3d); border-radius:3px;
    display:flex; align-items:center; justify-content:center; flex-direction:column; gap:.4rem;
    color:rgba(16,17,19,.85); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; cursor:grab;
  }
  .card b { font-family:"Anton",sans-serif; font-weight:400; font-size:1.6rem; }
  .tray .hedge { position:absolute; bottom:.6rem; left:.8rem; color:var(--bone-dim); font-size:.6rem; letter-spacing:.14em; text-transform:uppercase; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>27</b>Throw &amp; settle</p>

  <div class="tray" data-throw="tray">
    <div class="card" data-throw="card"><b>Flick</b><span>drag · throw · settle</span></div>
    <span class="hedge">— release with speed and it coasts; the tray leans with it</span>
  </div>

  <p class="hint">grab the card</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
<script src="https://assets.codepen.io/16327/InertiaPlugin.min.js"></script>
<script>
  // Design note: a physics throw — drag the card, release with velocity and
  // it coasts with inertia to the tray edge; the tray recoils against the
  // motion for a planted, tactile feel. Reduced motion: card sits still.
  gsap.registerPlugin(Draggable, InertiaPlugin);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const tray = document.querySelector('[data-throw="tray"]');
    const card = document.querySelector('[data-throw="card"]');
    const recoil = gsap.quickTo(tray, "x", { duration: 0.5, ease: "power3.out" });

    Draggable.create(card, {
      type: "x",
      bounds: tray,
      inertia: true,
      throwResistance: 2600,
      cursor: "grabbing",
      onDrag: function () { recoil(this.x * -0.05); },
      onThrowUpdate: function () { recoil(this.x * -0.05); },
      onDragEnd: function () { recoil(0); }
    });
  }
</script>
</body>
</html>
