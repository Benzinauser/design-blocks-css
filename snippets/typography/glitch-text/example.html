<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>47 — Glitch text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .glitch { position:relative; cursor:default; user-select:none; }
  .glitch .base {
    font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(3rem,11vw,10rem); line-height:1; display:block;
  }
  .glitch .g { position:absolute; inset:0; display:grid; place-items:center; pointer-events:none; opacity:0; will-change:transform,clip-path; }
  .glitch .g--r { color:var(--vermillion); }
  .glitch .g--c { color:var(--teal); }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>47</b>Glitch text — hover for a signal fault</p>

  <div class="glitch" data-glitch="wrap">
    <span class="base" data-glitch="base">Motion</span>
    <span class="g g--r" data-glitch="r">Motion</span>
    <span class="g g--c" data-glitch="c">Motion</span>
  </div>

  <p class="hint">— chromatic slices flicker for a beat, then the signal holds</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: a deliberate fault — hover introduces two chromatic copies
  // sliced into bands that jitter for a beat before the signal reasserts.
  // Reduced motion: no glitch, only the clean word (fault layers stay hidden).
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const wrap = document.querySelector('[data-glitch="wrap"]');
    const r = document.querySelector('[data-glitch="r"]');
    const c = document.querySelector('[data-glitch="c"]');

    const glitch = () => {
      const seq = gsap.timeline();
      const slices = [6, 18, 42, 64, 82];
      seq.set(r, { opacity: 1, clipPath: "inset(0 0 100% 0)" });
      slices.forEach((y, s) => {
        seq.to(r, { clipPath: `inset(${y}% 0 ${100 - y - 8}% 0)`, x: -14, duration: 0.04, ease: "none" }, s * 0.06)
           .to(r, { clipPath: "inset(0 0 100% 0)", x: 0, duration: 0.03, ease: "none" }, s * 0.06 + 0.05);
      });
      seq.set(c, { opacity: 1, clipPath: "inset(0 0 100% 0)" }, 0.1)
         .to(c, { x: 12, duration: 0.05, yoyo: true, repeat: 5, ease: "none" }, 0.1);
      slices.forEach((y, s) => {
        seq.to(c, { clipPath: `inset(${y + 4}% 0 ${100 - y - 10}% 0)`, duration: 0.035, ease: "none" }, 0.16 + s * 0.06)
           .to(c, { clipPath: "inset(0 0 100% 0)", duration: 0.03, ease: "none" }, 0.16 + s * 0.06 + 0.045);
      });
      seq.to([r, c], { opacity: 0, duration: 0.15, ease: "power2.out" }, 0.62);
    };

    let lock = false;
    wrap.addEventListener("mouseenter", () => {
      if (lock) return;
      lock = true;
      glitch();
      gsap.delayedCall(1, () => { lock = false; });
    });
  }
</script>
</body>
</html>
