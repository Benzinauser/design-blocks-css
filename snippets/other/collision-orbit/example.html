<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>59 — Collision orbit</title><style>
:root{--bg:#0f1012;--fg:#f2ede3;--hot:#ff4a17}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;overflow:hidden}.stage{height:100svh;display:grid;place-items:center}.orbit{width:min(78vw,620px);aspect-ratio:1;position:relative;border:1px solid #303236;border-radius:50%}.dot{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:var(--fg);will-change:transform}.dot:nth-child(3n){background:var(--hot)}.core{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--hot)}.meta{position:fixed;inset:1.5rem;display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.14em}.meta b{font-weight:400;color:var(--hot)}
</style></head><body><div class="meta"><span>07 / COLLISION ORBIT</span><b>CLICK TO IMPACT</b></div><main class="stage"><div class="orbit" id="orbit"><div class="core"></div></div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
const orbit=document.querySelector('#orbit'),N=9,dots=[];for(let i=0;i<N;i++){const d=document.createElement('div');d.className='dot';orbit.appendChild(d);dots.push({el:d,a:i/N*Math.PI*2,r:35+i%3*8,v:.002+i*.0002,boost:0})}function frame(){const w=orbit.clientWidth/2;dots.forEach((o,i)=>{o.a+=o.v+o.boost;o.boost*=.94;const r=w*(o.r/50),x=Math.cos(o.a)*r,y=Math.sin(o.a)*r;gsap.set(o.el,{x,y,scale:1+o.boost*12})});for(let i=0;i<N;i++)for(let j=i+1;j<N;j++){const a=dots[i],b=dots[j],dx=Math.cos(a.a)*a.r-Math.cos(b.a)*b.r,dy=Math.sin(a.a)*a.r-Math.sin(b.a)*b.r;if(Math.hypot(dx,dy)<8){a.boost+=.008;b.boost-=.006}}requestAnimationFrame(frame)}frame();orbit.addEventListener('click',e=>{const r=orbit.getBoundingClientRect(),angle=Math.atan2(e.clientY-r.top-r.height/2,e.clientX-r.left-r.width/2);dots.forEach((o,i)=>{const delta=Math.abs(Math.atan2(Math.sin(o.a-angle),Math.cos(o.a-angle)));if(delta<.7)o.boost+=.04*(1-delta/.7)})});
</script></body></html>
