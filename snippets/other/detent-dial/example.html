<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>32 — Detent dial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .dial {
    position:relative; width:min(52vw,260px); aspect-ratio:1; cursor:grab; touch-action:none; user-select:none;
  }
  .dial svg { width:100%; height:100%; }
  .dial .ring { fill:var(--ink-2); stroke:rgba(242,237,227,.25); stroke-width:2; }
  .tick { stroke:rgba(242,237,227,.2); stroke-width:2; transition:stroke .3s ease, stroke-width .3s ease; }
  .tick.on { stroke:var(--amber); stroke-width:4; }
  .knob {
    position:absolute; inset:0; border-radius:50%; will-change:transform; cursor:grab;
    display:grid; place-items:center;
  }
  .knob::before {
    content:""; position:absolute; top:6%; left:50%; width:3px; height:17%;
    background:var(--amber); border-radius:2px; transform:translateX(-50%);
  }
  .readout { font-family:"Anton",sans-serif; font-weight:400; font-size:2.4rem; color:var(--bone); letter-spacing:.06em; }
  .readout em { font-style:normal; color:var(--bone-dim); font-size:1.2rem; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>32</b>Detent dial</p>

  <div class="dial" data-dial="wrap">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle class="ring" cx="100" cy="100" r="94"></circle>
      <g data-dial="ticks"></g>
    </svg>
    <div class="knob" data-dial="knob"><span class="readout" data-dial="read">00<em> / 07</em></span></div>
  </div>

  <p class="hint">— spin it; it settles into the nearest click</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
<script src="https://assets.codepen.io/16327/InertiaPlugin.min.js"></script>
<script>
  // Design note: a mechanical detent — the knob spins freely with inertia,
  // then clicks into the nearest of 8 positions and the tick lights up.
  // Reduced motion: dial sits at position zero, no interaction.
  gsap.registerPlugin(Draggable, InertiaPlugin);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const N = 8, STEP = 360 / N;

  // draw 8 ticks
  const ticks = document.querySelector('[data-dial="ticks"]');
  for (let i = 0; i < N; i++) {
    const a = (i * STEP - 90) * Math.PI / 180;
    const x1 = 100 + Math.cos(a) * 78, y1 = 100 + Math.sin(a) * 78;
    const x2 = 100 + Math.cos(a) * 88, y2 = 100 + Math.sin(a) * 88;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1); line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.setAttribute("class", "tick");
    line.dataset.tick = i;
    ticks.appendChild(line);
  }
  const tickEls = gsap.utils.toArray(".tick");

  const knob = document.querySelector('[data-dial="knob"]');
  const read = document.querySelector('[data-dial="read"]');
  const setRead = (idx) => { read.innerHTML = String(idx).padStart(2, "0") + "<em> / " + (N - 1) + "</em>"; };
  const light = (idx) => { tickEls.forEach((t, i) => t.classList.toggle("on", i === idx)); };

  if (reduced) { setRead(0); light(0); }
  else {
    setRead(0); light(0);
    Draggable.create(knob, {
      type: "rotation",
      inertia: true,
      throwResistance: 1800,
      cursor: "grabbing",
      onDragEnd: function () {
        const target = gsap.utils.snap(STEP, this.rotation);
        gsap.to(knob, { rotation: target, duration: 0.7, ease: "elastic.out(1, 0.6)" });
        const idx = ((Math.round(target / STEP) % N) + N) % N;
        setRead(idx); light(idx);
      }
    });
  }
</script>
</body>
</html>
