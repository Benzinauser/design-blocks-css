<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>29 — Hold to charge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .button {
    position:relative; width:150px; height:150px; border-radius:50%; cursor:pointer; touch-action:none;
    display:grid; place-items:center; user-select:none; -webkit-user-select:none;
  }
  .button svg { position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .button .track { fill:none; stroke:rgba(242,237,227,.14); stroke-width:4; }
  .button .charge { fill:none; stroke:var(--teal); stroke-width:4; stroke-linecap:round; }
  .button .label { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--bone); text-align:center; }
  .button .label b { display:block; font-family:"Anton",sans-serif; font-weight:400; font-size:1.5rem; color:var(--bone); }
  .button:active { cursor:grabbing; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>29</b>Hold to charge</p>

  <div class="button" data-charge="btn" role="button" tabindex="0">
    <svg viewBox="0 0 150 150" aria-hidden="true">
      <circle class="track" cx="75" cy="75" r="68"></circle>
      <circle class="charge" cx="75" cy="75" r="68" stroke-dasharray="427.3" stroke-dashoffset="427.3"></circle>
    </svg>
    <span class="label" data-charge="label"><b>Hold</b>to confirm</span>
  </div>

  <p class="hint">— hold until the ring fills; release early and it springs back</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: tactile commitment — charge fills while you hold (pointer
  // captured); release early and the ring elastically snaps back, fill it
  // and the button pops to confirm. Reduced motion: a tap confirms at once.
  const btn = document.querySelector('[data-charge="btn"]');
  const ring = btn.querySelector(".charge");
  const label = btn.querySelector('[data-charge="label"]');
  const C = 427.3; // circle circumference
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const state = { p: 0 };
  let tween = null;
  const HOLD_MS = 1400;

  const setRing = (p) => { ring.style.strokeDashoffset = C * (1 - p); };

  const charge = () => {
    tween = gsap.to(state, {
      p: 1, duration: HOLD_MS / 1000, ease: "power1.inOut",
      onUpdate: () => {
        setRing(state.p);
        label.innerHTML = `<b>${Math.round(state.p * 100)}</b>%`;
      },
      onComplete: confirm
    });
  };

  const cancel = () => {
    if (!tween) return;
    tween.kill();
    gsap.to(state, { p: 0, duration: 0.4, ease: "power2.out", onUpdate: () => setRing(state.p) });
    gsap.to(ring, { strokeDashoffset: C, duration: 0.9, ease: "elastic.out(1, 0.55)" });
    label.innerHTML = "<b>Hold</b>to confirm";
  };

  const confirm = () => {
    tween = null;
    label.innerHTML = "<b>Go</b>released";
    gsap.fromTo(btn, { scale: 1 }, { scale: 1.08, duration: 0.35, ease: "power3.out", yoyo: true, repeat: 1 });
    gsap.fromTo(ring, { stroke: "#ff4a17", opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.inOut", onComplete: () => {
      ring.style.strokeDashoffset = C;
      gsap.set(ring, { stroke: "#2fd6c3", opacity: 1 });
      label.innerHTML = "<b>Hold</b>to confirm";
    }});
    state.p = 0;
  };

  if (reduced) {
    btn.addEventListener("click", () => confirm());
  } else {
    let holding = false;
    btn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      btn.setPointerCapture(e.pointerId);
      holding = true;
      charge();
    });
    btn.addEventListener("pointerup", () => {
      if (!holding) return;
      holding = false;
      if (state.p >= 1) return; // already confirmed
      cancel();
    });
    btn.addEventListener("lostpointercapture", () => {
      if (holding) { holding = false; cancel(); }
    });
  }
  btn.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); confirm(); }
  });
</script>
</body>
</html>
