<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>53 — Magnetic fracture</title><style>
:root{--bg:#101113;--fg:#f2ede3;--hot:#ff4a17;--dim:#686a6d}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}body{overflow:hidden}.stage{height:100svh;display:grid;place-items:center;position:relative}.field{position:relative;width:min(86vw,820px);height:min(68vh,620px)}.node{position:absolute;width:clamp(58px,8vw,92px);aspect-ratio:1;border:1px solid #36383b;border-radius:50%;display:grid;place-items:center;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;background:#141619;will-change:transform}.node i{width:8px;height:8px;background:var(--hot);border-radius:50%;display:block}.hint{position:absolute;top:1.5rem;left:1.5rem;font-size:.68rem;letter-spacing:.14em;color:#85878a}.title{position:absolute;bottom:1.5rem;right:1.5rem;font-size:clamp(2rem,6vw,5rem);letter-spacing:-.05em;line-height:.85;text-align:right}.line{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.line path{stroke:#3b3d40;stroke-width:1;fill:none;opacity:.5}
</style></head><body><main class="stage"><div class="hint">01 / MAGNETIC FRACTURE · MOVE POINTER</div><svg class="line" viewBox="0 0 100 100" preserveAspectRatio="none"><path id="web"/></svg><div class="field" id="field"></div><div class="title">ATTRACTION<br>HAS TENSION.</div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
const field=document.querySelector('#field'), web=document.querySelector('#web');const labels=['A','B','C','D','E','F','G','H','I','J'];const nodes=[];const pos=[];labels.forEach((t,i)=>{const el=document.createElement('div');el.className='node';el.innerHTML=`<i></i>${t}`;field.appendChild(el);const a=i/labels.length*Math.PI*2;const r=i%2?31:22;pos.push({x:50+Math.cos(a)*r,y:50+Math.sin(a)*r});nodes.push(el)});function layout(){const w=field.clientWidth,h=field.clientHeight;nodes.forEach((el,i)=>{el._base={x:pos[i].x/100*w,y:pos[i].y/100*h};gsap.set(el,{x:el._base.x-el.offsetWidth/2,y:el._base.y-el.offsetHeight/2})})}layout();addEventListener('resize',layout);const pointer={x:-9999,y:-9999};field.addEventListener('pointermove',e=>{const r=field.getBoundingClientRect();pointer.x=e.clientX-r.left;pointer.y=e.clientY-r.top});field.addEventListener('pointerleave',()=>{pointer.x=pointer.y=-9999});gsap.ticker.add(()=>{nodes.forEach((el,i)=>{const dx=pointer.x-el._base.x,dy=pointer.y-el._base.y,d=Math.hypot(dx,dy),force=Math.max(0,1-d/260);const pull=force*force*75;gsap.set(el,{x:el._base.x-el.offsetWidth/2+dx/d*pull||el._base.x-el.offsetWidth/2,y:el._base.y-el.offsetHeight/2+dy/d*pull||el._base.y-el.offsetHeight/2,rotation:force*(i%2?-7:7)})});let d='';nodes.forEach((a,i)=>{const b=nodes[(i+1)%nodes.length],ar=a.getBoundingClientRect(),br=b.getBoundingClientRect(),fr=field.getBoundingClientRect();d+=`${i?'L':'M'} ${(ar.left+ar.width/2-fr.left)/fr.width*100} ${(ar.top+ar.height/2-fr.top)/fr.height*100} `});web.setAttribute('d',d)});
</script></body></html>
