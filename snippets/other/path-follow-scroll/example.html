<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>39 — Path-follow scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .journey { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .map { width:min(90vw,760px); margin:0 auto; }
  .map svg { width:100%; height:auto; overflow:visible; }
  .route { fill:none; stroke:rgba(242,237,227,.18); stroke-width:2; }
  .route-draw { fill:none; stroke:var(--teal); stroke-width:3; stroke-linecap:round; stroke-dasharray:8 10; }
  .marker { fill:var(--amber); }
  .waypoint { fill:rgba(242,237,227,.4); }
  .tags { display:flex; gap:1.6rem; flex-wrap:wrap; justify-content:center; }
  .tags span { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .tags b { color:var(--teal); font-weight:400; }
</style>
</head>
<body>
<section class="journey">
  <p class="kicker"><b>39</b>Path-follow scroll — the marker rides the route as you scroll</p>

  <div class="map" data-path="map">
    <svg viewBox="0 0 760 260" aria-hidden="true">
      <path class="route" d="M30 140 C 180 20, 320 240, 470 120 S 720 70, 730 130"></path>
      <path class="route-draw" d="M30 140 C 180 20, 320 240, 470 120 S 720 70, 730 130" data-path="draw"></path>
      <circle class="marker" cx="30" cy="140" r="9" data-path="marker"></circle>
      <circle class="waypoint" cx="250" cy="162" r="5"></circle>
      <circle class="waypoint" cx="470" cy="120" r="5"></circle>
      <circle class="waypoint" cx="660" cy="106" r="5"></circle>
    </svg>
  </div>

  <div class="tags">
    <span><b>01</b> brief</span>
    <span><b>02</b> draft</span>
    <span><b>03</b> beat</span>
    <span><b>04</b> ship</span>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/MotionPathPlugin.min.js"></script>
<script>
  // Design note: an amber marker rides an SVG route, its progress bound one
  // to one with the scroll — the journey line dashes after it. Reduced
  // motion: the marker rests at the start and the route stays whole.
  gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const draw = document.querySelector('[data-path="draw"]');
  const marker = document.querySelector('[data-path="marker"]');
  const LEN = draw.getTotalLength();
  gsap.set(draw, { strokeDasharray: "8 10" });

  if (!reduced) {
    gsap.to(marker, {
      motionPath: { path: ".route", align: ".route", alignOrigin: [0.5, 0.5] },
      ease: "none",
      scrollTrigger: { trigger: '[data-path="map"]', start: "top 80%", end: "bottom 60%", scrub: 1 }
    });
    gsap.fromTo(draw,
      { strokeDashoffset: LEN },
      { strokeDashoffset: 0, ease: "none",
        scrollTrigger: { trigger: '[data-path="map"]', start: "top 80%", end: "bottom 60%", scrub: 1 } });
  }
</script>
</body>
</html>
