<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>33 — Rotate on scroll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .rot { padding:clamp(4rem,12vh,8rem) clamp(1.25rem,4vw,4rem); }
  .lead { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); margin-bottom:calc(clamp(4rem,12vh,8rem) * .4); }
  .lead b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .word {
    font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(3rem,11vw,10rem); line-height:1.12; will-change:transform;
  }
  .word:nth-child(even) { color:var(--vermillion); }
  .word:nth-child(3n) { color:var(--teal); }
  .tail { min-height:40svh; }
</style>
</head>
<body>
<section class="rot">
  <p class="lead"><b>33</b>Rotate on scroll — each word spins a full turn as it passes</p>
  <p class="word" data-rot="word">Motion</p>
  <p class="word" data-rot="word">Atlas</p>
  <p class="word" data-rot="word">Frames</p>
  <p class="word" data-rot="word">Sequences</p>
  <p class="word" data-rot="word">Easing</p>
  <p class="word" data-rot="word">Rhythm</p>
</section>
<div class="tail"></div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: each word completes one full rotation while it travels
  // through the viewport — rotation, not translation, is the scroll currency.
  // Reduced motion: the words simply stand.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    gsap.utils.toArray('[data-rot="word"]').forEach((word) => {
      gsap.fromTo(word, { rotation: 0 }, {
        rotation: 360,
        ease: "none",
        scrollTrigger: { trigger: word, start: "top bottom", end: "bottom top", scrub: 1 }
      });
    });
  }
</script>
</body>
</html>
