<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>25 — Odometer roll</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .odo-wrap { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .odo { display:inline-flex; align-items:flex-end; gap:.4rem; }
  .col {
    height:1.1em; overflow:hidden; position:relative;
    font-family:"Anton",sans-serif; font-weight:400; font-size:clamp(3rem,10vw,9rem); line-height:1;
  }
  .col .digits { display:flex; flex-direction:column; will-change:transform; }
  .col .digit { height:1em; line-height:1; }
  .sep { font-family:"Anton",sans-serif; font-size:clamp(3rem,10vw,9rem); color:var(--amber); }
  .label { color:var(--bone-dim); margin-top:1rem; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="odo-wrap">
  <p class="kicker"><b>25</b>Odometer roll</p>
  <div>
    <div class="odo" data-odo="value" data-target="1284">
      <span class="col" data-odo="col"><span class="digits" data-odo="digits"></span></span>
      <span class="col" data-odo="col"><span class="digits" data-odo="digits"></span></span>
      <span class="col" data-odo="col"><span class="digits" data-odo="digits"></span></span>
      <span class="col" data-odo="col"><span class="digits" data-odo="digits"></span></span>
    </div>
    <p class="label">frames delivered this year</p>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: a mechanical counter — each digit column spins from a random
  // offset to its target digit, left to right, like an odometer settling.
  // Reduced motion: digits snap to the final value.
  gsap.registerPlugin(ScrollTrigger);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const target = document.querySelector('[data-odo="value"]').dataset.target;
  const digits = [...target].map(Number);
  const cols = gsap.utils.toArray('[data-odo="col"]');

  cols.forEach((col, i) => {
    const digitsEl = col.querySelector('[data-odo="digits"]');
    for (let d = 0; d < 10; d++) {
      const span = document.createElement("span");
      span.className = "digit";
      span.textContent = d;
      digitsEl.appendChild(span);
    }
    const goal = digits[i];
    if (reduced) {
      gsap.set(digitsEl, { yPercent: -10 * goal });
      return;
    }
    gsap.fromTo(digitsEl,
      { yPercent: gsap.utils.random(-110, -10) },
      {
        yPercent: -10 * goal,
        duration: 1.3 + i * 0.18,
        ease: "power4.inOut",
        delay: i * 0.08,
        scrollTrigger: { trigger: col, start: "top 85%", once: true }
      });
  });
</script>
</body>
</html>
