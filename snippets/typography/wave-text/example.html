<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>21 — Wave text</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .wave { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); text-align:center; }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }
  .line {
    font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(2.6rem,9vw,8.5rem); line-height:1.05; max-width:16ch;
  }
  .line .char { display:inline-block; will-change:transform; }
  .line .char.accent { color:var(--teal); }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="wave">
  <p class="kicker"><b>21</b>Wave text</p>
  <p class="line" data-wave="line">Stay in motion</p>
  <p class="hint">— an ambient ripple, never louder than the words</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://assets.codepen.io/16327/SplitText3.min.js"></script>
<script>
  // Design note: an ambient ripple travels across the characters — a gentle,
  // looping sine, yoyo'd so nothing ever rests at a pose. Reduced motion:
  // the line sits still.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const line = document.querySelector('[data-wave="line"]');
    const split = new SplitText(line, { type: "chars", charsClass: "char" });

    gsap.to(split.chars, {
      y: -16,
      duration: 0.85,
      ease: "sine.inOut",
      stagger: { each: 0.07, yoyo: true, repeat: -1 },
      repeat: -1
    });
  }
</script>
</body>
</html>
