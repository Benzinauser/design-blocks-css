<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>50 — Lines to layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .blueprint { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .sheet { position:relative; width:min(90vw,700px); margin:0 auto; }
  .sheet svg { width:100%; height:auto; overflow:visible; }
  .pen { fill:none; stroke:var(--teal); stroke-width:2.5; stroke-linecap:round; }
  .pen--soft { stroke:rgba(47,214,195,.4); stroke-width:1.5; }
  .dot { fill:var(--bone); }
  .dot--hot { fill:var(--vermillion); }
  .note { position:absolute; font-size:.66rem; letter-spacing:.16em; text-transform:uppercase; color:var(--bone-dim); }
  .note b { color:var(--amber); font-weight:400; }
  .bottom { text-align:center; color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="blueprint">
  <p class="kicker"><b>50</b>Lines to layout — the system draws itself on scroll</p>

  <div class="sheet" data-bp="sheet">
    <svg viewBox="0 0 700 430" aria-hidden="true">
      <line class="pen pen--soft" x1="30" y1="250" x2="670" y2="250" data-bp="stroke"></line>
      <line class="pen" x1="120" y1="80" x2="120" y2="330" data-bp="stroke"></line>
      <line class="pen" x1="120" y1="330" x2="330" y2="330" data-bp="stroke"></line>
      <line class="pen" x1="330" y1="80" x2="330" y2="330" data-bp="stroke"></line>
      <line class="pen" x1="470" y1="80" x2="470" y2="330" data-bp="stroke"></line>
      <line class="pen" x1="330" y1="330" x2="470" y2="330" data-bp="stroke"></line>
      <line class="pen" x1="120" y1="180" x2="470" y2="180" data-bp="stroke"></line>
      <circle class="dot" cx="120" cy="80" r="7" data-bp="node"></circle>
      <circle class="dot" cx="330" cy="80" r="7" data-bp="node"></circle>
      <circle class="dot--hot" cx="470" cy="80" r="9" data-bp="node"></circle>
      <circle class="dot" cx="470" cy="330" r="7" data-bp="node"></circle>
    </svg>
    <span class="note" style="left:8%; top:38%;" data-bp="label"><b>grid</b> · 12 col</span>
    <span class="note" style="left:36%; top:8%;" data-bp="label"><b>hero</b> · 04</span>
    <span class="note" style="left:64%; top:38%;" data-bp="label"><b>cta</b> · 01</span>
  </div>

  <p class="bottom">— strokes draw, joints land, labels set: click nothing, scroll once</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: the blueprint draws itself — hard strokes trace in sequence,
  // joints nick in, and captions set last, all bound to one scroll pass.
  // Reduced motion: the sheet is already complete.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const sheet = document.querySelector('[data-bp="sheet"]');
    const strokes = gsap.utils.toArray('[data-bp="stroke"]');
    const nodes = gsap.utils.toArray('[data-bp="node"]');
    const labels = gsap.utils.toArray('[data-bp="label"]');

    strokes.forEach((s) => {
      const L = s.getTotalLength();
      gsap.set(s, { strokeDasharray: L, strokeDashoffset: L });
    });

    gsap.to(strokes, {
      strokeDashoffset: 0,
      ease: "none",
      stagger: { each: 0.12, from: 0 },
      scrollTrigger: { trigger: sheet, start: "top 72%", end: "bottom 55%", scrub: 1 }
    });
    gsap.fromTo(nodes, { scale: 0.4, opacity: 0 }, {
      scale: 1, opacity: 1, ease: "back.out(2.2)", stagger: 0.09,
      scrollTrigger: { trigger: sheet, start: "top 45%", end: "bottom 40%", scrub: 1 }
    });
    gsap.fromTo(labels, { opacity: 0, x: -8 }, {
      opacity: 1, x: 0, ease: "power2.out", stagger: 0.08,
      scrollTrigger: { trigger: sheet, start: "top 30%", end: "bottom 25%", scrub: 1 }
    });
  }
</script>
</body>
</html>
