<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>05 — Elastic rows</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55);
    --bone-faint:rgba(242,237,227,.16); --vermillion:#ff4a17;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"Space Grotesk",sans-serif; }
  .mono { font-family:"IBM Plex Mono",monospace; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }

  .index { padding:clamp(3rem,10vh,8rem) clamp(1.25rem,4vw,4rem); }
  .head { margin-bottom:2.5rem; font-family:"IBM Plex Mono",monospace; font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; }
  .head b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .list { border-top:1px solid var(--bone-faint); }
  .item { border-bottom:1px solid var(--bone-faint); }

  .row {
    width:100%; display:grid; grid-template-columns:3.2rem 1fr auto; align-items:center; gap:1rem;
    padding:clamp(1.1rem,2.5vh,1.7rem) 0; background:none; border:0; color:inherit;
    font:inherit; text-align:left; cursor:pointer;
  }
  .row .num { color:var(--vermillion); }
  .row .name { font-family:"Anton",sans-serif; font-weight:400; font-size:clamp(1.8rem,4.5vw,3.4rem); text-transform:uppercase; line-height:1; }
  .row .plus { justify-self:end; font-size:1.4rem; color:var(--bone-dim); transition:transform .5s cubic-bezier(.65,0,.35,1); }
  .item[data-open="true"] .plus { transform:rotate(45deg); color:var(--vermillion); }

  .body { height:0; overflow:hidden; }
  .body-inner { max-width:46rem; padding:0 0 clamp(1.4rem,3vh,2.2rem) calc(3.2rem + 1rem); color:var(--bone-dim); }
  .body-inner p + p { margin-top:.7rem; color:var(--bone-faint); }
</style>
</head>
<body>
<section class="index">
  <p class="head"><b>05</b>Index — tap a row</p>

  <div class="list" data-cap="list">
    <div class="item" data-cap="item">
      <button class="row" data-cap="row" aria-expanded="false" aria-controls="body-1">
        <span class="num mono">01</span><span class="name">Direction</span><span class="plus mono" aria-hidden="true">+</span>
      </button>
      <div class="body" id="body-1" data-cap="body">
        <div class="body-inner"><p>We decide what moves, what waits, and what never does.</p><p class="mono">— stage · gaze · silence</p></div>
      </div>
    </div>

    <div class="item" data-cap="item">
      <button class="row" data-cap="row" aria-expanded="false" aria-controls="body-2">
        <span class="num mono">02</span><span class="name">Choreography</span><span class="plus mono" aria-hidden="true">+</span>
      </button>
      <div class="body" id="body-2" data-cap="body">
        <div class="body-inner"><p>Sequence, timing and the grammar of transition.</p><p class="mono">— beats · weights · holds</p></div>
      </div>
    </div>

    <div class="item" data-cap="item">
      <button class="row" data-cap="row" aria-expanded="false" aria-controls="body-3">
        <span class="num mono">03</span><span class="name">Interaction</span><span class="plus mono" aria-hidden="true">+</span>
      </button>
      <div class="body" id="body-3" data-cap="body">
        <div class="body-inner"><p>Motion as response — drag, hover, scroll, press.</p><p class="mono">— drag · hover · scroll · press</p></div>
      </div>
    </div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: one row open at a time; the body height springs open with an
  // elastic ease (the signature of this snippet) and contracts on a plain
  // power3. Reduced motion: a simple, fast swap instead of the spring.
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  gsap.utils.toArray('[data-cap="item"]').forEach((item, i) => {
    const row = item.querySelector('[data-cap="row"]');
    const body = item.querySelector('[data-cap="body"]');

    const open = () => {
      gsap.utils.toArray('[data-cap="item"]').forEach((it, j) => {
        const b = it.querySelector('[data-cap="body"]');
        const willOpen = j === i && it.dataset.open !== "true";
        it.dataset.open = willOpen ? "true" : "false";
        it.querySelector('[data-cap="row"]').setAttribute("aria-expanded", willOpen ? "true" : "false");
        if (willOpen) {
          gsap.to(b, {
            height: b.scrollHeight,
            duration: reduced ? 0.45 : 1.15,
            ease: reduced ? "power2.out" : "elastic.out(1, 0.62)",
            overwrite: "auto"
          });
        } else {
          gsap.to(b, { height: 0, duration: 0.55, ease: "power3.inOut", overwrite: "auto" });
        }
      });
    };

    row.addEventListener("click", open);
    row.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
    });
  });
</script>
</body>
</html>
