<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>34 — Balloon button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .balloon {
    display:inline-flex; align-items:center; gap:1.4rem;
    padding:1.2rem 2.6rem; background:linear-gradient(135deg,var(--vermillion),#ff8a3d);
    color:rgba(16,17,19,.88); border:none; border-radius:4px; cursor:pointer;
    font-family:"IBM Plex Mono",monospace; font-size:.8rem; letter-spacing:.16em; text-transform:uppercase;
    will-change:transform,border-radius,box-shadow;
  }
  .balloon b { font-weight:400; }
  .balloon .arrow { transition:transform .3s ease; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>34</b>Balloon button</p>
  <button class="balloon" data-balloon="btn" type="button">
    <span>Hover to inflate</span><span class="arrow" aria-hidden="true">→</span>
  </button>
  <p class="hint">— it swells into a pill and lifts a shadow; click and it pops</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: a button that inflates like a balloon — scale, corner and
  // shadow all swell together on hover, and deflate with an elastic on leave.
  // Reduced motion: hover swell is disabled; the click pop stays (interaction).
  const btn = document.querySelector('[data-balloon="btn"]');
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  if (!reduced) {
    btn.addEventListener("mouseenter", () => {
      gsap.to(btn, {
        scale: 1.16, borderRadius: "99px", boxShadow: "0 24px 40px rgba(255,74,23,.28)",
        duration: 0.55, ease: "power3.out", overwrite: "auto"
      });
      gsap.to(btn.querySelector(".arrow"), { x: 8, duration: 0.4, ease: "power2.out", overwrite: "auto" });
    });
    btn.addEventListener("mouseleave", () => {
      gsap.to(btn, {
        scale: 1, borderRadius: "4px", boxShadow: "0 0 0 rgba(255,74,23,0)",
        duration: 0.8, ease: "elastic.out(1, 0.5)", overwrite: "auto"
      });
      gsap.to(btn.querySelector(".arrow"), { x: 0, duration: 0.5, ease: "power3.out", overwrite: "auto" });
    });
  }

  btn.addEventListener("click", () => {
    gsap.fromTo(btn, { scale: 1.22 }, { scale: reduced ? 1 : 1, duration: 0.9, ease: "elastic.out(1, 0.4)" });
  });
</script>
</body>
</html>
