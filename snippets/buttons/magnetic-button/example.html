<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>16 — Magnetic button</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); text-align:center; }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .magnetic {
    position:relative; display:inline-block; will-change:transform;
  }
  .magnetic button {
    position:relative; display:inline-flex; align-items:center; gap:1.2rem;
    padding:1.2rem 2.4rem; border:1px solid rgba(242,237,227,.35); background:var(--ink);
    color:var(--bone); font-family:"IBM Plex Mono",monospace; font-size:.8rem;
    letter-spacing:.18em; text-transform:uppercase; cursor:pointer; will-change:transform;
  }
  .magnetic button::after {
    content:""; position:absolute; inset:-1px; background:var(--vermillion); z-index:-1;
    transform:scale(0); transform-origin:center;
  }
  .magnetic button span { display:inline-block; will-change:transform; }

  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>16</b>Magnetic button</p>

  <div class="magnetic" data-magnetic="wrap">
    <button data-magnetic="btn" type="button"><span>Start the motion</span><span aria-hidden="true">→</span></button>
  </div>

  <p class="hint">— the button leans toward the cursor, then springs home</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: within a small radius the button is pulled toward the cursor
  // (quickTo) while its label counter-shifts for depth; leaving the scene
  // snaps it back with an elastic. Reduced motion: no magnetism.
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const wrap = document.querySelector('[data-magnetic="wrap"]');
    const btn = document.querySelector('[data-magnetic="btn"]');
    const label = btn.querySelector("span");
    const R = 150, strength = 0.38;

    const bx = gsap.quickTo(btn, "x", { duration: 0.45, ease: "power3.out" });
    const by = gsap.quickTo(btn, "y", { duration: 0.45, ease: "power3.out" });
    const lx = gsap.quickTo(label, "x", { duration: 0.45, ease: "power3.out" });
    const ly = gsap.quickTo(label, "y", { duration: 0.45, ease: "power3.out" });

    document.addEventListener("mousemove", (e) => {
      const r = btn.getBoundingClientRect();
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      const dx = e.clientX - cx, dy = e.clientY - cy;
      if (Math.hypot(dx, dy) < R) {
        bx(dx * strength); by(dy * strength);
        lx(-dx * 0.18); ly(-dy * 0.18);
      } else {
        bx(0); by(0); lx(0); ly(0);
      }
    });
    document.addEventListener("mouseleave", () => {
      gsap.to(btn, { x: 0, y: 0, duration: 0.9, ease: "elastic.out(1, 0.45)", overwrite: true });
      gsap.to(label, { x: 0, y: 0, duration: 0.9, ease: "elastic.out(1, 0.45)", overwrite: true });
    });
  }
</script>
</body>
</html>
