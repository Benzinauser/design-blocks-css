<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>10 — Clip-path panel reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .reveal { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem; }
  .panel {
    aspect-ratio:3/4; display:flex; flex-direction:column; justify-content:space-between;
    padding:1.1rem; color:rgba(16,17,19,.85); font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
    /* clip-path set by JS; without JS the panel is fully visible */
  }
  .panel b { font-family:"Anton",sans-serif; font-weight:400; font-size:2.4rem; text-transform:uppercase; }
  .panel--a { background:linear-gradient(135deg,var(--vermillion),#ff8a3d); }
  .panel--b { background:linear-gradient(135deg,var(--teal),#7fe3d8); }
  .panel--c { background:linear-gradient(135deg,var(--amber),#ffe39a); }

  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<section class="reveal">
  <p class="kicker"><b>10</b>Clip-path reveal</p>
  <div class="grid">
    <div class="panel panel--a" data-clip="panel"><span>figure 01</span><b>Open</b><span>inset reveals</span></div>
    <div class="panel panel--b" data-clip="panel"><span>figure 02</span><b>Top</b><span>first</span></div>
    <div class="panel panel--c" data-clip="panel"><span>figure 03</span><b>Down</b><span>the page</span></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: each panel unmasks from the top edge (clip-path inset) as it
  // enters, one after another — a staged vertical wipe. Reduced motion: no
  // clip, panels are simply there.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    gsap.utils.toArray('[data-clip="panel"]').forEach((panel) => {
      gsap.fromTo(panel,
        { clipPath: "inset(100% 0% 0% 0%)" },
        {
          clipPath: "inset(0% 0% 0% 0%)",
          duration: 1,
          ease: "power3.inOut",
          scrollTrigger: { trigger: panel, start: "top 85%" }
        });
    });
  }
</script>
</body>
</html>
