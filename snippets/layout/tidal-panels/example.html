<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>58 — Tidal panels</title><style>
:root{--bg:#111315;--fg:#f2ede3;--hot:#2fd6c3}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace}.stage{height:260svh}.pin{height:100svh;position:sticky;top:0;overflow:hidden;display:grid;place-items:center}.panel{position:absolute;width:62vw;height:78vh;border:1px solid #383b3e;display:grid;place-items:center;font:400 clamp(3rem,11vw,10rem)/.8 Arial,sans-serif;letter-spacing:-.08em;will-change:transform}.panel span{mix-blend-mode:difference}.meta{position:fixed;z-index:4;top:1.5rem;left:1.5rem;right:1.5rem;display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.14em}.meta b{color:var(--hot);font-weight:400}.rail{position:fixed;z-index:4;left:1.5rem;bottom:1.5rem;width:100px;height:2px;background:#34373a}.rail i{display:block;height:100%;background:var(--hot);transform-origin:left;transform:scaleX(0)}
</style></head><body><div class="meta"><span>06 / TIDAL PANELS</span><b>SCROLL = TIDE</b></div><main class="stage"><div class="pin"><div class="panel"><span>01</span></div><div class="panel"><span>02</span></div><div class="panel"><span>03</span></div><div class="panel"><span>04</span></div></div></main><div class="rail"><i></i></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script><script>
gsap.registerPlugin(ScrollTrigger);const panels=gsap.utils.toArray('.panel'),rail=document.querySelector('.rail i');panels.forEach((p,i)=>gsap.set(p,{x:i*18-27,y:i*10-15,rotation:i*2,zIndex:i}));const tl=gsap.timeline({scrollTrigger:{trigger:'.stage',start:'top top',end:'bottom bottom',scrub:1}});panels.forEach((p,i)=>{tl.to(p,{x:i%2?'-42vw':'42vw',rotation:i%2?-9:9,scale:.72,duration:.9,ease:'power2.inOut'},i*.22).to(p,{x:i%2?'18vw':'-18vw',y:'+=12vh',duration:.9,ease:'sine.inOut'},i*.22+.9)});gsap.to(rail,{scaleX:1,scrollTrigger:{trigger:'.stage',start:'top top',end:'bottom bottom',scrub:true}});
</script></body></html>
