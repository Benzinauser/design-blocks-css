<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>36 — 3D grid stagger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .gridzone { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .grid { display:grid; grid-template-columns:repeat(4,1fr); gap:1rem; perspective:1000px; }
  .tile3d {
    aspect-ratio:3/4; border-radius:3px; display:flex; align-items:flex-end; padding:0.9rem;
    font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(16,17,19,.85);
    will-change:transform;
  }
  .tile3d b { font-family:"Anton",sans-serif; font-weight:400; font-size:1.6rem; }
  @keyframes none {}
  .tile3d--a { background:linear-gradient(135deg,var(--vermillion),#ff8a3d); }
  .tile3d--b { background:linear-gradient(135deg,var(--amber),#ffe39a); }
  .tile3d--c { background:linear-gradient(135deg,var(--teal),#7fe3d8); }
  .tile3d--d { background:linear-gradient(135deg,#8a6df1,#c4b4ff); }
  .tile3d--e { background:linear-gradient(135deg,var(--bone),#b9b2a4); }
  .tile3d--f { background:linear-gradient(135deg,#ff8ab5,#ffb3cf); }
  .tile3d--g { background:linear-gradient(135deg,var(--ink-2),#2a2d31); color:var(--teal); }
  .tile3d--h { background:linear-gradient(135deg,#ff9e64,#ffc48a); }
  @media (max-width:760px) { .grid { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<section class="gridzone">
  <p class="kicker"><b>36</b>3D grid stagger — cards rise from the flat, row by row</p>
  <div class="grid" data-grid3="grid">
    <div class="tile3d tile3d--a" data-grid3="tile"><b>01</b></div>
    <div class="tile3d tile3d--b" data-grid3="tile"><b>02</b></div>
    <div class="tile3d tile3d--c" data-grid3="tile"><b>03</b></div>
    <div class="tile3d tile3d--d" data-grid3="tile"><b>04</b></div>
    <div class="tile3d tile3d--e" data-grid3="tile"><b>05</b></div>
    <div class="tile3d tile3d--f" data-grid3="tile"><b>06</b></div>
    <div class="tile3d tile3d--g" data-grid3="tile"><b>07</b></div>
    <div class="tile3d tile3d--h" data-grid3="tile"><b>08</b></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: the grid rises from a flat horizon — every tile stands up
  // from rotationX 90° in perspective, row by row, as the section enters.
  // Reduced motion: the grid is simply there.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const tiles = gsap.utils.toArray('[data-grid3="tile"]');
    gsap.set(tiles, { transformOrigin: "50% 100%" });
    gsap.fromTo(tiles,
      { rotationX: 90, opacity: 0.25 },
      {
        rotationX: 0, opacity: 1,
        duration: 1.1,
        ease: "power4.out",
        stagger: { each: 0.09, from: "start", grid: "auto", axis: "y" },
        scrollTrigger: { trigger: '[data-grid3="grid"]', start: "top 78%", once: true }
      });
  }
</script>
</body>
</html>
