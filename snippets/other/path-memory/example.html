<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>55 — Path memory</title><style>
:root{--bg:#101113;--fg:#f2ede3;--hot:#2fd6c3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace}.stage{height:100svh;display:grid;place-items:center;overflow:hidden}.stage svg{width:min(90vw,900px);height:75svh;overflow:visible}.route{fill:none;stroke:#34373a;stroke-width:1}.ghost{fill:none;stroke:var(--hot);stroke-width:2;stroke-linecap:round;stroke-dasharray:1 18}.orb{fill:var(--fg)}.meta{position:fixed;inset:1.5rem;display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.14em}.meta b{color:var(--hot);font-weight:400}
</style></head><body><div class="meta"><span>03 / PATH MEMORY</span><span>SCROLL TO REWRITE THE ROUTE</span></div><main class="stage"><svg viewBox="0 0 900 700"><path id="route" class="route" d="M80 520 C180 80 330 650 450 330 S720 50 820 500"/><path id="memory" class="ghost" d="M80 520 C180 80 330 650 450 330 S720 50 820 500"/><circle class="orb" r="7"/><circle class="orb" r="4" opacity=".35"/></svg></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script><script>
gsap.registerPlugin(ScrollTrigger);const path=document.querySelector('#route'),mem=document.querySelector('#memory'),orbs=document.querySelectorAll('.orb');const len=path.getTotalLength();gsap.set(mem,{strokeDasharray:`${len}`,strokeDashoffset:len});const state={p:0};gsap.to(state,{p:1,ease:'none',scrollTrigger:{trigger:document.body,start:'top top',end:'+=1800',scrub:1}});gsap.ticker.add(()=>{const p=state.p;const pt=path.getPointAtLength(len*p);const tangent=path.getPointAtLength(Math.min(len,p*len+1));const angle=Math.atan2(tangent.y-pt.y,tangent.x-pt.x)*180/Math.PI;orbs.forEach((o,i)=>{o.setAttribute('cx',pt.x+(i?12:-12));o.setAttribute('cy',pt.y+(i?12:-12))});gsap.set(mem,{strokeDashoffset:len*(1-p),attr:{transform:`rotate(${angle*.04} 450 350)`}})});document.body.style.height='1900px';
</script></body></html>
