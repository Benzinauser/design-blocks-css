<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>57 — Pressure grid</title><style>
:root{--bg:#e9e4da;--ink:#111;--hot:#ff4a17}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-monospace,monospace}.stage{height:100svh;display:grid;place-items:center;overflow:hidden}.grid{width:min(82vw,720px);aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);gap:2px}.cell{background:#111;aspect-ratio:1;transform-origin:center;will-change:transform}.label{position:fixed;inset:1.5rem;display:flex;justify-content:space-between;font-size:.68rem;letter-spacing:.14em}.label b{color:var(--hot);font-weight:400}.meter{position:fixed;bottom:1.5rem;left:1.5rem;font-size:.68rem}
</style></head><body><div class="label"><span>05 / PRESSURE GRID</span><b>PROXIMITY IS FORCE</b></div><main class="stage"><div class="grid" id="grid"></div></main><div class="meter">PRESSURE <span id="meter">000</span></div><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
const grid=document.querySelector('#grid'),meter=document.querySelector('#meter'),cells=[];for(let i=0;i<81;i++){const c=document.createElement('div');c.className='cell';grid.appendChild(c);cells.push(c)}let p={x:-9999,y:-9999};grid.addEventListener('pointermove',e=>{const r=grid.getBoundingClientRect();p.x=e.clientX-r.left;p.y=e.clientY-r.top});grid.addEventListener('pointerleave',()=>p.x=p.y=-9999);gsap.ticker.add(()=>{const r=grid.getBoundingClientRect();let max=0;cells.forEach((c,i)=>{const rr=c.getBoundingClientRect(),cx=rr.left-r.left+rr.width/2,cy=rr.top-r.top+rr.height/2,d=Math.hypot(p.x-cx,p.y-cy),f=Math.max(0,1-d/180);max=Math.max(max,f);gsap.set(c,{scale:1-f*.72,rotation:f*18,opacity:.25+f*.75})});meter.textContent=String(Math.round(max*999)).padStart(3,'0')});
</script></body></html>
