<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>17 — Scroll progress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  /* progress indicator — fixed to the right edge */
  .progress {
    position:fixed; top:0; right:clamp(1.25rem,3vw,3rem); bottom:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:space-between;
    padding:1.2rem 0; pointer-events:none;
  }
  .progress .track { flex:1; width:1px; background:rgba(242,237,227,.16); position:relative; margin:1rem 0; }
  .progress .fill {
    position:absolute; inset:0; background:var(--vermillion);
    transform:scaleY(0); transform-origin:top; will-change:transform;
  }
  .progress .pct { font-size:.68rem; letter-spacing:.14em; color:var(--bone-dim); }

  @media (prefers-reduced-motion: reduce) { .progress { display:none; } }

  .sections { padding-right:4rem; }
  .sec { min-height:100svh; display:flex; flex-direction:column; justify-content:center; padding:clamp(1.25rem,4vw,4rem); }
  .sec h2 { font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase; font-size:clamp(2.4rem,8vw,7rem); line-height:1; }
  .sec h2 b { color:var(--vermillion); font-weight:400; }
  .sec p { color:var(--bone-dim); max-width:30rem; margin-top:1.2rem; }
</style>
</head>
<body>

<div class="progress" aria-hidden="true">
  <span class="pct">top</span>
  <span class="track"><span class="fill" data-progress="fill"></span></span>
  <span class="pct" data-progress="pct">0%</span>
</div>

<div class="sections">
  <section class="sec"><h2>Scroll <b>progress</b></h2><p>17 · a thin vermilion line grows down the right edge, and the percentage keeps the score. Reduced motion: the indicator is hidden.</p></section>
  <section class="sec"><h2>Chapter <b>two</b></h2><p>The line is honest: it never lies about how far you are from the end.</p></section>
  <section class="sec"><h2>Chapter <b>three</b></h2><p>Almost there — the fill is nearly complete.</p></section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: a fixed rail fills with scroll progress (scaleY) and the
  // percentage ticks up alongside — wayfinding, not decoration.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    gsap.to('[data-progress="fill"]', {
      scaleY: 1,
      ease: "none",
      scrollTrigger: {
        start: 0,
        end: "max",
        scrub: 0.2,
        onUpdate: (self) => {
          document.querySelector('[data-progress="pct"]').textContent =
            Math.round(self.progress * 100) + "%";
        }
      }
    });
  }
</script>
</body>
</html>
