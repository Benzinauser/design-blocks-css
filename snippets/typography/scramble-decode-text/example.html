<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>08 — Scramble decode</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .decode { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }
  .lines { display:flex; flex-direction:column; gap:1.1rem; }
  .line { font-size:clamp(1.1rem,3vw,2.4rem); color:var(--bone); letter-spacing:.06em; }
  .line[data-open="true"] { color:var(--bone); }
  .line .tag { color:var(--bone-dim); font-size:.68rem; letter-spacing:.16em; margin-right:1rem; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
<body>
<section class="decode">
  <p class="kicker"><b>08</b>Scramble decode</p>

  <div class="lines">
    <p class="line" data-scramble="We design the space between frames."><span class="tag">/01</span><span data-scramble-target>██████████████████████████████████</span></p>
    <p class="line" data-scramble="Motion is a language, not a garnish."><span class="tag">/02</span><span data-scramble-target>██████████████████████████████████</span></p>
    <p class="line" data-scramble="Restraint is the loudest move."><span class="tag">/03</span><span data-scramble-target>██████████████████████████████</span></p>
  </div>

  <p class="hint">— scroll, then read</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://assets.codepen.io/16327/ScrambleTextPlugin3.min.js"></script>
<script>
  // Design note: each line decodes from noise into its message, one after
  // another, as the reader scrolls — text earns its meaning. Reduced motion:
  // the target text is written in directly, no scramble.
  gsap.registerPlugin(ScrollTrigger, ScrambleTextPlugin);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  // Each <span data-scramble-target> decodes into the phrase held by its
  // parent <p data-scramble="...">. Reduced motion: written directly.
  document.querySelectorAll('[data-scramble-target]').forEach((holder) => {
    const target = holder.closest('[data-scramble]').dataset.scramble;

    if (reduced) {
      holder.textContent = target;
      return;
    }
    gsap.to(holder, {
      scrambleText: { text: target, chars: "upperCase", speed: 0.6, tweenLength: false },
      duration: 1.6,
      ease: "power2.inOut",
      scrollTrigger: { trigger: holder, start: "top 82%", toggleActions: "play none none reverse" }
    });
  });
</script>
</body>
</html>
