<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>28 — Spring trail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; cursor:none; }

  .stage { height:100svh; display:flex; align-items:flex-end; padding:clamp(1.25rem,4vw,4rem); padding-bottom:3rem; overflow:hidden; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
  .hint b { color:var(--teal); font-weight:400; margin-right:.8rem; }

  .blob {
    position:fixed; top:0; left:0; width:34px; height:34px; border-radius:50%;
    background:radial-gradient(circle at 34% 34%, var(--vermillion), #c9340e);
    pointer-events:none; z-index:10; opacity:0; will-change:transform;
  }
  .blob::after {
    content:""; position:absolute; inset:-12px; border-radius:50%;
    border:1px solid rgba(47,214,195,.5);
  }

  @media (prefers-reduced-motion: reduce) { .blob { display:none; } .stage { cursor:auto; } }
</style>
</head>
<body>
<div class="blob" data-trail="blob" aria-hidden="true"></div>
<section class="stage" data-trail="stage">
  <p class="hint"><b>28</b>Spring trail — move, then stop</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: a spring-mass companion — the blob chases the cursor with
  // lag and stretches along its velocity, rubber that never quite catches
  // up. Reduced motion: the blob is removed entirely.
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!reduced) {
    const blob = document.querySelector('[data-trail="blob"]');
    const stage = document.querySelector('[data-trail="stage"]');
    let tx = innerWidth / 2, ty = innerHeight / 2;      // pointer target
    let x = tx, y = ty, vx = 0, vy = 0;                 // spring state
    let seen = false;

    stage.addEventListener("mousemove", (e) => {
      if (!seen) { seen = true; x = tx = e.clientX; y = ty = e.clientY; gsap.to(blob, { opacity: 1, duration: 0.4 }); }
      tx = e.clientX; ty = e.clientY;
    });
    document.addEventListener("mouseleave", () => gsap.to(blob, { opacity: 0, duration: 0.5 }));

    gsap.ticker.add(() => {
      vx += (tx - x) * 0.10; vx *= 0.84;
      vy += (ty - y) * 0.10; vy *= 0.84;
      x += vx; y += vy;

      const speed = Math.hypot(vx, vy);
      const stretch = 1 + Math.min(speed * 0.018, 0.5);
      const angle = Math.atan2(vy, vx) * 180 / Math.PI;

      gsap.set(blob, {
        x: x - 17, y: y - 17,
        rotation: angle,
        scaleX: stretch,
        scaleY: 2 - stretch,
        transformOrigin: "50% 50%"
      });
    });
  }
</script>
</body>
</html>
