<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>52 — Double slideshow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .deck { position:relative; width:min(86vw,640px); height:min(54vw,400px); perspective:900px; }
  .panel { position:absolute; inset:0; border-radius:5px; overflow:hidden; opacity:0; will-change:transform,opacity; }
  .panel .mat { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:1.4rem; font-size:.66rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(16,17,19,.86); }
  .panel .mat b { font-family:"Anton",sans-serif; font-weight:400; font-size:2.4rem; letter-spacing:.02em; }
  .panel--fg { z-index:2; }
  .panel--bg { z-index:1; }
  .panel--a { background:linear-gradient(135deg,var(--vermillion),#ff8a3d); }
  .panel--b { background:linear-gradient(135deg,var(--amber),#ffe39a); }
  .panel--c { background:linear-gradient(135deg,var(--teal),#7fe3d8); }
  .panel--d { background:linear-gradient(135deg,#8a6df1,#c4b4ff); }
  .controls { display:flex; gap:1.2rem; align-items:center; }
  .controls button {
    background:none; border:1px solid rgba(242,237,227,.3); color:var(--bone); cursor:pointer;
    padding:.45rem 1rem; font-family:"IBM Plex Mono",monospace; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase;
  }
  .controls button:hover { border-color:var(--teal); }
  .controls span { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; }
  .controls b { color:var(--teal); font-weight:400; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>52</b>Double slideshow — a foreground and a background that swap turns</p>

  <div class="deck" data-slide="deck">
    <div class="panel panel--bg panel--a" data-slide="bg"><div class="mat"><b>01 </b>Ambience — the backdrop breathes</div></div>
    <div class="panel panel--fg panel--b" data-slide="fg"><div class="mat"><b>02 </b>Interruption — in comes the action</div></div>
    <div class="panel panel--bg panel--c" data-slide="bg"><div class="mat"><b>03 </b>Directions cross</div></div>
    <div class="panel panel--fg panel--d" data-slide="fg"><div class="mat"><b>04 </b>The curtain drops</div></div>
  </div>

  <div class="controls">
    <button data-slide="prev" type="button">prev</button>
    <span><b data-slide="idx">01</b> / 04</span>
    <button data-slide="next" type="button">next</button>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: two decks take turns — the foreground turns over in 3D while
  // the background morphs behind it, so every step reads on two depths.
  // Reduced motion: panels simply crossfade.
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const deck = document.querySelector('[data-slide="deck"]');
  const fg = gsap.utils.toArray('[data-slide="fg"]');
  const bg = gsap.utils.toArray('[data-slide="bg"]');
  const idx = document.querySelector('[data-slide="idx"]');
  let cur = 0;
  const N = fg.length;

  gsap.set(fg[0], { opacity: 1 });
  gsap.set(bg[0], { opacity: 0.65 });

  const show = (next, dir) => {
    const o = fg[cur], n = fg[next], ob = bg[cur], nb = bg[next];
    idx.textContent = String(next + 1).padStart(2, "0");
    if (reduced) {
      gsap.to(o, { opacity: 0, duration: 0 });
      gsap.to(ob, { opacity: 0, duration: 0 });
      gsap.to(n, { opacity: 1, duration: 0 });
      gsap.to(nb, { opacity: 0.65, duration: 0 });
      cur = next;
      return;
    }
    const tl = gsap.timeline({ onComplete: () => { cur = next; } });
    tl.set(n, { zIndex: 3, opacity: 1, x: 0, rotationY: dir * -90 })
      .set(o, { zIndex: 3 })
      .to(o, { rotationY: dir * 90, opacity: 0.4, duration: 0.55, ease: "power3.in" })
      .to(n, { rotationY: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, "<")
      .to(ob, { opacity: 0, scale: 1.08, duration: 0.7, ease: "power2.inOut" }, 0)
      .fromTo(nb, { opacity: 0, scale: 0.92 }, { opacity: 0.65, scale: 1, duration: 0.7, ease: "power2.inOut" }, 0)
      .set(o, { zIndex: 1, rotationY: 0 })
      .set(ob, { scale: 1, opacity: 0 });
  };

  const next = () => show((cur + 1) % N, 1);
  const prev = () => show((cur + N - 1) % N, -1);
  document.querySelector('[data-slide="next"]').addEventListener("click", next);
  document.querySelector('[data-slide="prev"]').addEventListener("click", prev);
</script>
</body>
</html>
