<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>11 — Count-up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stats { min-height:100svh; display:flex; flex-direction:column; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:1.5rem; }
  .stat { border-top:1px solid rgba(242,237,227,.16); padding-top:1.2rem; }
  .stat .value {
    font-family:"Anton",sans-serif; font-weight:400; font-size:clamp(3rem,7vw,6rem); line-height:1;
  }
  .stat .value em { font-style:normal; color:var(--amber); }
  .stat .label { color:var(--bone-dim); margin-top:.6rem; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }

  @media (max-width:760px) { .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<section class="stats">
  <p class="kicker"><b>11</b>Count-up</p>
  <div class="grid">
    <div class="stat"><p class="value"><span data-count="value" data-target="1284">0</span><em>h</em></p><p class="label">frames directed</p></div>
    <div class="stat"><p class="value"><span data-count="value" data-target="96">0</span><em>%</em></p><p class="label">clients returning</p></div>
    <div class="stat"><p class="value"><span data-count="value" data-target="13">0</span><em>yrs</em></p><p class="label">in motion</p></div>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: figures count up as they enter — a measured, arithmetical
  // beat next to the expressive motion elsewhere. Reduced motion: final
  // values are written directly, no tween.
  gsap.registerPlugin(ScrollTrigger);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.querySelectorAll('[data-count="value"]').forEach((el) => {
    const target = parseInt(el.dataset.target, 10);
    if (reduced) { el.textContent = target; return; }

    const obj = { val: 0 };
    gsap.to(obj, {
      val: target,
      duration: 1.8,
      ease: "power3.out",
      onUpdate: () => { el.textContent = Math.round(obj.val); },
      scrollTrigger: { trigger: el, start: "top 85%", once: true }
    });
  });
</script>
</body>
</html>
