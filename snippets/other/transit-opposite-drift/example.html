<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>03 — Pinned opposite drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#101113; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55);
    --bone-faint:rgba(242,237,227,.16); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; overflow-x:clip; }

  .transit {
    display:flex; flex-direction:column; justify-content:center; gap:2.5rem;
    min-height:100svh; padding:clamp(3rem,8vh,6rem) 0;
  }
  .head { padding:0 clamp(1.25rem,4vw,4rem); display:flex; align-items:baseline; gap:1.5rem; }
  .head h2 { font-size:.8rem; letter-spacing:.16em; text-transform:uppercase; }
  .head h2 b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }
  .head p { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }

  .track { overflow:hidden; padding:.5rem 0; }
  .track-inner { display:flex; gap:clamp(.8rem,1.6vw,1.4rem); width:max-content; will-change:transform; }
  .plate {
    flex:0 0 auto; width:clamp(230px,26vw,320px); height:clamp(150px,17vw,200px);
    display:flex; align-items:flex-end; justify-content:space-between; padding:.9rem 1rem;
    border-radius:2px; font-size:.68rem; letter-spacing:.14em; text-transform:uppercase; color:rgba(16,17,19,.82);
  }
  .plate::after { content:attr(data-index); font-size:.62rem; opacity:.6; }
  .plate--a { background:linear-gradient(135deg,var(--vermillion),#ff8a3d); }
  .plate--b { background:linear-gradient(135deg,var(--teal),#7fe3d8); }
  .plate--c { background:linear-gradient(135deg,var(--amber),#ffe39a); }
  .plate--d { background:linear-gradient(135deg,#8a6df1,#c4b4ff); }
  .plate--e { background:linear-gradient(135deg,var(--bone),#b9b2a4); }
  .plate--f { background:linear-gradient(315deg,var(--amber),#ff8a3d); }
  .plate--g { background:linear-gradient(315deg,#4f8ae3,#9cc4ff); }
  .plate--h { background:linear-gradient(315deg,var(--vermillion),#ffb199); }
  .plate--i { background:linear-gradient(315deg,var(--teal),#bff0ea); }
  .plate--j { background:linear-gradient(315deg,#6de3a3,#c9ffdd); }
</style>
</head>
<body>
<!-- Pin this section; two tracks drift in opposite directions as you scroll -->
<section class="transit" data-transit="section">
  <div class="head">
    <h2><b>03</b>Transit</h2>
    <p>Two tracks, opposite headings — keep scrolling</p>
  </div>

  <div class="track"><div class="track-inner" data-transit="track" data-dir="east">
    <div class="plate plate--a">Plate 01</div><div class="plate plate--b">Plate 02</div>
    <div class="plate plate--c">Plate 03</div><div class="plate plate--d">Plate 04</div>
    <div class="plate plate--e">Plate 05</div>
  </div></div>

  <div class="track"><div class="track-inner" data-transit="track" data-dir="west">
    <div class="plate plate--f">Plate 06</div><div class="plate plate--g">Plate 07</div>
    <div class="plate plate--h">Plate 08</div><div class="plate plate--i">Plate 09</div>
    <div class="plate plate--j">Plate 10</div>
  </div></div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script>
  // Design note: the section pins while the east track exits left and the
  // west track enters from the left — one scrubbed timeline, two opposing
  // directions. Reduced motion: no pin, no drift; the page just scrolls.
  gsap.registerPlugin(ScrollTrigger);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const tracks = gsap.utils.toArray('[data-transit="track"]');
    tracks.forEach((track) => {
      track.querySelectorAll(".plate").forEach((p, j) => { p.dataset.index = String(j + 1).padStart(2, "0"); });
    });

    const [east, west] = tracks;
    const dist = (t) => t.scrollWidth - t.parentElement.offsetWidth;

    gsap.timeline({
      scrollTrigger: {
        trigger: '[data-transit="section"]',
        start: "top top",
        end: "+=170%",
        scrub: 0.6,
        pin: true,
        anticipatePin: 1
      }
    })
      .fromTo(east, { x: 0 }, { x: () => -dist(east), ease: "none" }, 0)
      .fromTo(west, { x: () => -dist(west) }, { x: 0, ease: "none" }, 0);
  }
</script>
</body>
</html>
