<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>56 — Phase collapse</title><style>
:root{--bg:#151719;--fg:#f2ede3;--hot:#ff4a17}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,monospace;overflow:hidden}.stage{height:100svh;display:grid;place-items:center}.word{position:relative;font:400 clamp(4rem,14vw,13rem)/.8 Arial,sans-serif;letter-spacing:-.08em}.char{display:inline-block;will-change:transform}.phase{position:fixed;left:1.5rem;top:1.5rem;font-size:.68rem;letter-spacing:.14em}.phase b{color:var(--hot);font-weight:400}.sub{position:fixed;right:1.5rem;bottom:1.5rem;font-size:.68rem;letter-spacing:.1em;color:#74777b}
</style></head><body><main class="stage"><div class="phase">04 / PHASE COLLAPSE · <b>HOVER</b></div><div class="word" id="word">PHASE</div><div class="sub">RELATED OBJECTS DO NOT MOVE TOGETHER.</div></main><script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script><script>
const word=document.querySelector('#word');word.innerHTML=[...word.textContent].map(c=>`<span class="char">${c}</span>`).join('');const chars=[...document.querySelectorAll('.char')];const tl=gsap.timeline({paused:true});chars.forEach((c,i)=>tl.to(c,{y:gsap.utils.random(-35,35),rotation:gsap.utils.random(-18,18),scale:gsap.utils.random(.7,1.35),duration:.45,ease:'power3.out'},i*.045));word.addEventListener('pointerenter',()=>tl.play());word.addEventListener('pointerleave',()=>tl.reverse());let t=0;gsap.ticker.add((_,dt)=>{t+=dt*.001;chars.forEach((c,i)=>{gsap.set(c,{x:Math.sin(t*1.5+i*.7)*4,y:`+=${Math.cos(t*1.1+i*.4)*.25}`})})});
</script></body></html>
