<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>35 — 3D carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .deck { perspective:1100px; cursor:grab; touch-action:none; }
  .ring { position:relative; width:min(72vw,440px); height:min(46vw,300px); transform-style:preserve-3d; will-change:transform; }
  .card3d {
    position:absolute; inset:0; border-radius:4px; backface-visibility:visible;
    display:flex; flex-direction:column; justify-content:space-between; padding:1.1rem;
    color:rgba(16,17,19,.85); font-size:.64rem; letter-spacing:.14em; text-transform:uppercase;
  }
  .card3d b { font-family:"Anton",sans-serif; font-weight:400; font-size:1.7rem; }
  .card3d--a { background:linear-gradient(135deg,var(--vermillion),#ff8a3d); }
  .card3d--b { background:linear-gradient(135deg,var(--amber),#ffe39a); }
  .card3d--c { background:linear-gradient(135deg,var(--teal),#7fe3d8); }
  .card3d--d { background:linear-gradient(135deg,#8a6df1,#c4b4ff); }
  .card3d--e { background:linear-gradient(135deg,var(--bone),#b9b2a4); }
  .pos { font-size:.72rem; letter-spacing:.14em; color:var(--bone-dim); }
  .pos b { color:var(--teal); font-weight:400; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>35</b>3D carousel</p>

  <div class="deck" data-car="deck">
    <div class="ring" data-car="ring">
      <div class="card3d card3d--a" data-car="card"><span>/01</span><b>Direction</b></div>
      <div class="card3d card3d--b" data-car="card"><span>/02</span><b>Choreography</b></div>
      <div class="card3d card3d--c" data-car="card"><span>/03</span><b>Interaction</b></div>
      <div class="card3d card3d--d" data-car="card"><span>/04</span><b>Systems</b></div>
      <div class="card3d card3d--e" data-car="card"><span>/05</span><b>Narrative</b></div>
    </div>
  </div>

  <p class="pos"><b data-car="pos">01</b> / 05 — drag to spin</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
<script src="https://assets.codepen.io/16327/InertiaPlugin.min.js"></script>
<script>
  // Design note: five cards orbit on a 3D ring; dragging spins the ring with
  // inertia and it clicks into the nearest card, whose index reads out.
  // Reduced motion: a static ring, front card only.
  gsap.registerPlugin(Draggable, InertiaPlugin);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const deck = document.querySelector('[data-car="deck"]');
  const ring = document.querySelector('[data-car="ring"]');
  const cards = gsap.utils.toArray('[data-car="card"]');
  const pos = document.querySelector('[data-car="pos"]');
  const N = cards.length, STEP = 360 / N, R = 300;

  // place cards on the ring
  cards.forEach((card, i) => {
    gsap.set(card, { transform: `rotateY(${i * STEP}deg) translateZ(${R}px)` });
  });

  const setPos = (angle) => {
    let idx = Math.round((((angle % 360) + 360) % 360) / STEP) % N;
    pos.textContent = String(idx + 1).padStart(2, "0");
  };
  const snap = (angle) => {
    const target = Math.round((((angle % 360) + 360) % 360) / STEP) * STEP;
    gsap.to(ring, { rotationY: target, duration: 0.8, ease: "elastic.out(1, 0.55)", overwrite: "auto" });
    setPos(target);
  };

  if (!reduced) {
    let dragging = false, acc = 0;
    deck.addEventListener("pointerdown", (e) => {
      dragging = true;
      deck.setPointerCapture(e.pointerId);
      gsap.killTweensOf(ring);
    });
    deck.addEventListener("pointermove", (e) => {
      if (!dragging) return;
      acc += e.movementX * 0.45;
      gsap.set(ring, { rotationY: acc });
      setPos(acc);
    });
    deck.addEventListener("pointerup", () => { dragging = false; snap(acc); });
    deck.addEventListener("lostpointercapture", () => { if (dragging) { dragging = false; snap(acc); } });
  }
</script>
</body>
</html>
