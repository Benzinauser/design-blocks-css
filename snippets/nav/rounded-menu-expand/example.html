<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>48 — Rounded menu expand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }
  .hint { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }

  .burger {
    position:fixed; top:1.4rem; right:1.4rem; z-index:30;
    width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
    background:var(--bone); display:grid; place-items:center;
  }
  .burger span { display:block; width:20px; height:2px; background:var(--ink); margin:0 auto; transition:none; }
  .burger span + span { margin-top:5px; }

  .veil {
    position:fixed; inset:0; z-index:20; pointer-events:none; opacity:0;
    background:radial-gradient(circle at 100% 0%, var(--ink-2), #101113);
    border-radius:50%; will-change:transform,border-radius,opacity;
  }
  .menu {
    position:fixed; inset:0; z-index:25; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:1.6rem; pointer-events:none;
    opacity:0;
  }
  .menu a {
    font-family:"Anton",sans-serif; font-weight:400; text-transform:uppercase;
    font-size:clamp(2rem,7vw,4.5rem); color:var(--bone); text-decoration:none;
    opacity:0; transform:translateY(18px); display:block;
  }
  .menu a:hover { color:var(--vermillion); }
  .menu .idx { color:var(--teal); font-size:.7rem; letter-spacing:.14em; margin-right:1.2rem; font-family:"IBM Plex Mono",monospace; }
</style>
</head>
<body>
<button class="burger" data-menu="burger" aria-label="toggle menu" aria-expanded="false">
  <span></span><span></span>
</button>
<div class="veil" data-menu="veil"></div>
<nav class="menu" data-menu="links" aria-hidden="true">
  <a href="#"><span class="idx">01</span>direction</a>
  <a href="#"><span class="idx">02</span>choreography</a>
  <a href="#"><span class="idx">03</span>systems</a>
  <a href="#"><span class="idx">04</span>archive</a>
</nav>

<section class="stage">
  <p class="kicker"><b>48</b>Rounded menu — a button blossoms into full chrome</p>
  <p class="hint">— the disc swells from the button and the links surface one by one</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
  // Design note: the menu appears as a single disc that blooms from the
  // button's corner, flattening as it grows, with the links surfacing in its
  // wake. Reduced motion: the veil fades — no expansion, no travel.
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const burger = document.querySelector('[data-menu="burger"]');
  const veil = document.querySelector('[data-menu="veil"]');
  const links = document.querySelector('[data-menu="links"]');
  const items = gsap.utils.toArray(links.querySelectorAll("a"));
  let open = false, busy = false;

  const close = () => {
    open = false; busy = true;
    burger.setAttribute("aria-expanded", "false");
    links.setAttribute("aria-hidden", "true");
    if (reduced) {
      gsap.to(veil, { opacity: 0, duration: 0.2, onComplete: () => { busy = false; links.style.pointerEvents = "none"; } });
      return;
    }
    const tl = gsap.timeline({ onComplete: () => { busy = false; links.style.pointerEvents = "none"; } });
    tl.to(items, { opacity: 0, y: 18, duration: 0.25, stagger: 0.03, ease: "power2.in" })
      .to(veil, { borderRadius: "50%", scale: 1, duration: 0.5, ease: "power3.in" }, "-=0.1")
      .to(veil, { opacity: 0, duration: 0.35, ease: "power2.out" }, "-=0.15");
  };

  const openMenu = () => {
    open = true; busy = true;
    burger.setAttribute("aria-expanded", "true");
    links.setAttribute("aria-hidden", "false");
    if (reduced) {
      gsap.to(veil, { opacity: 0.92, duration: 0.2, onComplete: () => { busy = false; links.style.pointerEvents = "auto"; } });
      return;
    }
    const tl = gsap.timeline({ onComplete: () => { busy = false; links.style.pointerEvents = "auto"; } });
    tl.set(veil, { opacity: 1, scale: 0.001, borderRadius: "50%" })
      .set(veil, { transformOrigin: "100% 0%" })
      .to(veil, { scale: 60, borderRadius: "0%", duration: 0.75, ease: "power4.inOut" })
      .to(items, { opacity: 1, y: 0, duration: 0.5, stagger: 0.08, ease: "power3.out" }, "-=0.3");
  };

  burger.addEventListener("click", () => { if (busy) return; open ? close() : openMenu(); });
</script>
</body>
</html>
