<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>30 — Magnetic snap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root { --ink:#101113; --ink-2:#17191c; --bone:#f2ede3; --bone-dim:rgba(242,237,227,.55); --vermillion:#ff4a17; --amber:#ffc43d; --teal:#2fd6c3; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ink); color:var(--bone); font-family:"IBM Plex Mono",monospace; }

  .stage { min-height:100svh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:clamp(1.25rem,4vw,4rem); }
  .kicker { font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--bone-dim); }
  .kicker b { color:var(--vermillion); font-weight:400; margin-right:.8rem; }

  .board {
    position:relative; width:min(88vw,640px); aspect-ratio:4/3;
    border:1px solid rgba(242,237,227,.2); border-radius:3px; touch-action:none;
  }
  .slot { position:absolute; width:30%; height:38%; border:1px dashed rgba(242,237,227,.25); border-radius:3px; }
  .tile {
    position:absolute; width:30%; height:38%; border-radius:3px; cursor:grab;
    display:grid; place-items:center; font-family:"Anton",sans-serif; font-weight:400;
    font-size:2rem; color:rgba(16,17,19,.85); will-change:transform;
  }
  .tile--1 { background:linear-gradient(135deg,var(--vermillion),#ff8a3d); }
  .tile--2 { background:linear-gradient(135deg,var(--amber),#ffe39a); }
  .tile--3 { background:linear-gradient(135deg,var(--teal),#7fe3d8); }
  .tile--4 { background:linear-gradient(135deg,#8a6df1,#c4b4ff); }
  .tile--5 { background:linear-gradient(135deg,var(--bone),#b9b2a4); }
  .tile--6 { background:linear-gradient(135deg,#ff8ab5,#ffb3cf); }
  .status { color:var(--bone-dim); font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; }
  .status b { color:var(--teal); font-weight:400; }
</style>
</head>
<body>
<section class="stage">
  <p class="kicker"><b>30</b>Magnetic snap</p>

  <div class="board" data-snap="board">
    <div class="slot" style="left:4%; top:8%"></div>
    <div class="slot" style="left:35%; top:8%"></div>
    <div class="slot" style="left:66%; top:8%"></div>
    <div class="slot" style="left:4%; top:54%"></div>
    <div class="slot" style="left:35%; top:54%"></div>
    <div class="slot" style="left:66%; top:54%"></div>

    <!-- tiles sit at SHUFFLED layout positions; dragging seats them via transform -->
    <div class="tile tile--1" data-snap="tile" data-slot="0" style="left:4%; top:54%">A</div>
    <div class="tile tile--2" data-snap="tile" data-slot="1" style="left:66%; top:54%">B</div>
    <div class="tile tile--3" data-snap="tile" data-slot="2" style="left:35%; top:8%">C</div>
    <div class="tile tile--4" data-snap="tile" data-slot="3" style="left:4%; top:8%">D</div>
    <div class="tile tile--5" data-snap="tile" data-slot="4" style="left:66%; top:8%">E</div>
    <div class="tile tile--6" data-snap="tile" data-slot="5" style="left:35%; top:54%">F</div>
  </div>

  <p class="status" data-snap="status"><b data-snap="count">0/6</b> tiles seated</p>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/Draggable.min.js"></script>
<script>
  // Design note: tiles start shuffled; drag one into a slot's magnetic field
  // and it is pulled in with an elastic seat — release it free and it springs
  // back to its last seat. All comparisons in viewport space, motions relative.
  // Reduced motion: tiles render already aligned, nothing draggable.
  gsap.registerPlugin(Draggable);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  const board = document.querySelector('[data-snap="board"]');
  const tiles = gsap.utils.toArray('[data-snap="tile"]');
  const slots = gsap.utils.toArray(".slot");
  const count = document.querySelector('[data-snap="count"]');
  const MAGNET = 90; // px — pull-in radius

  const center = (el) => { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; };
  const slotCenters = slots.map(center);
  // layout slots, in percent, indexed like the slot elements
  const SLOT_POS = [[4, 8], [35, 8], [66, 8], [4, 54], [35, 54], [66, 54]];

  const sendHome = (tile) => {
    const h = +tile.dataset.slot;
    const c = center(tile);
    const d = Math.hypot(c.x - slotCenters[h].x, c.y - slotCenters[h].y);
    if (d < 13) return; // already seated
    const dr = Draggable.get(tile);
    const tx = dr.x + (slotCenters[h].x - c.x);
    const ty = dr.y + (slotCenters[h].y - c.y);
    gsap.to(tile, {
      x: tx, y: ty, duration: 0.6, ease: "power3.out",
      onComplete: () => { dr.x = tx; dr.y = ty; }
    });
  };

  if (reduced) {
    tiles.forEach((tile) => {
      const p = SLOT_POS[+tile.dataset.slot];
      gsap.set(tile, { left: p[0] + "%", top: p[1] + "%" });
    });
    count.textContent = "6/6";
  } else {
    let seated = 0;
    const updateCount = () => { count.textContent = seated + "/6"; };

    tiles.forEach((tile, i) => {
      Draggable.create(tile, {
        type: "x,y",
        bounds: board,
        cursor: "grabbing",
        onDragEnd: function () {
          const c = center(tile);
          let best = -1, bestD = 1e9;
          slotCenters.forEach((sc, k) => {
            if (tiles.some((t, j) => j !== i && t.dataset.sat === "1" && +t.dataset.slot === k && t !== tile)) return; // occupied
            const d = Math.hypot(c.x - sc.x, c.y - sc.y);
            if (d < bestD) { bestD = d; best = k; }
          });
          if (best >= 0 && bestD < MAGNET) {
            const dr = Draggable.get(tile);
            const tx = dr.x + (slotCenters[best].x - c.x);
            const ty = dr.y + (slotCenters[best].y - c.y);
            gsap.to(tile, {
              x: tx, y: ty, duration: 0.75, ease: "elastic.out(1, 0.55)",
              onComplete: () => { dr.x = tx; dr.y = ty; }
            });
            if (tile.dataset.sat !== "1") { tile.dataset.sat = "1"; seated++; updateCount(); }
          } else {
            sendHome(tile); // free drop → spring to the tile's own slot
          }
        }
      });
    });
  }
</script>
</body>
</html>
